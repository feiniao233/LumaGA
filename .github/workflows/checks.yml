name: Android checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Validation only: no release signing, uploads, deployment, or repository writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    if: github.repository == 'feiniao233/LumaGA'
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Hosted Android runners provide the SDK. The native Rust libraries and
      # standard Android debug keystore are already committed in this project.
      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: |
          if ./gradlew lintDebug --no-daemon --stacktrace; then
            exit 0
          else
            # Preserve failure, but expose every issue without uploading artifacts.
            test ! -f app/build/reports/lint-results-debug.txt || cat app/build/reports/lint-results-debug.txt
            exit 1
          fi

      - name: Compile debug APK (no upload)
        # A pre-existing lint error must not hide whether the APK compiles.
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compile unsigned release APK (no upload)
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' }}
        run: |
          test ! -f app/release-keystore.properties
          ./gradlew assembleRelease --no-daemon --stacktrace
